# Quality Gate (CI) — machine-verifiable conformance (ARCHITECTURE.md §42, §27).
#
# CI counterpart of scripts/quality-gate.ps1 (local, PowerShell): the local
# gate's checks — compile, Ruff, Black, test suite — plus a CI-only
# dependency audit (§27: dependencies are checked regularly, i.e. in the
# automated delivery flow, not on every local run).
#
# The project itself (runtime + [dev] dependencies) is installed from
# pyproject.toml, the single source of truth for the development tooling
# the gate runs (pinned ruff==0.16.6 / black==26.5.1 live in
# [project.optional-dependencies] dev). The only dependency pinned in this
# file is pip-audit: a CI-only security scanner that the local gate does
# not run, and therefore deliberately not a project dependency. Do not
# duplicate other dependency pins in this file; keep it in sync with
# pyproject.toml only when the gate steps themselves change.

name: Quality Gate

on:
  push:
    branches: [main, arena/01a0e203-application-factory]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-gate:
    name: Install + Dependency check + Compile + Ruff + Black + Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install project with dev dependencies (declared in pyproject.toml)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Verify production-only TestClient dependency and probes
        run: |
          python -m venv /tmp/application-factory-runtime-venv
          /tmp/application-factory-runtime-venv/bin/python -m pip install --upgrade pip
          /tmp/application-factory-runtime-venv/bin/python -m pip install .
          /tmp/application-factory-runtime-venv/bin/python - <<'PY'
          from fastapi import FastAPI
          from fastapi.testclient import TestClient

          app = FastAPI()

          @app.get("/health")
          def health():
              return {"status": "ok"}

          @app.get("/ready")
          def ready():
              return {"status": "ready"}

          with TestClient(app) as client:
              health = client.get("/health")
              ready = client.get("/ready")
              assert health.status_code == 200, health.text
              assert health.json() == {"status": "ok"}, health.text
              assert ready.status_code == 200, ready.text
              assert ready.json() == {"status": "ready"}, ready.text

          print("Production-only TestClient and health/readiness probes: OK")
          PY

      - name: Dependency check (machine-verifiable, ARCHITECTURE.md §27)
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip check
          python -m pip_audit

      - name: Compile source and Control Plane
        run: python -m compileall -q src factory/control_plane/factory_control_plane

      - name: Ruff
        run: ruff check .

      - name: Black
        run: black --check .

      - name: Root test suite
        run: python -m pytest tests/

      - name: Control Plane test suite
        run: python -m pytest factory/control_plane/tests
