name: Publish component artifacts

on:
  pull_request:
    branches: [main]
    paths:
      - "src/factory_artifact/**"
      - "src/component_registry/**"
      - "scripts/build_component_artifacts.py"
      - "tests/test_component_artifact_publication.py"
      - "components/**"
      - "src/*_service/**"
      - "src/idempotency/**"
      - "factory/registry/**"
      - ".github/workflows/publish-component-artifacts.yml"
  push:
    branches: [main]
    paths:
      - "src/factory_artifact/**"
      - "src/component_registry/**"
      - "scripts/build_component_artifacts.py"
      - "components/**"
      - "src/*_service/**"
      - "src/idempotency/**"
      - "factory/registry/**"
      - ".github/workflows/publish-component-artifacts.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Build and verify all nine artifacts
        run: |
          python scripts/build_component_artifacts.py --output factory/artifacts
          python -m pytest -q tests/test_component_artifact_publication.py

      - name: Publish canonical manifests and source packages to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL https://github.com/oras-project/oras/releases/download/v1.3.0/oras_1.3.0_linux_amd64.tar.gz -o /tmp/oras.tgz
          tar -xzf /tmp/oras.tgz -C /tmp oras
          install /tmp/oras /usr/local/bin/oras
          echo "$GHCR_TOKEN" | oras login ghcr.io -u "$GHCR_USER" --password-stdin

          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          items = json.loads(Path("factory/artifacts/publication-manifest.json").read_text())
          for item in items:
              component = item["component_id"]
              version = item["component_version"]
              digest = item["artifact"]["digest"]
              root = item["source_root"]
              manifest = f"factory/artifacts/{digest}/canonical.json"
              target = f"ghcr.io/kvasha62/application-factory/{component}"
              subprocess.run(
                  [
                      "oras", "push", f"{target}:{version}",
                      "--artifact-type",
                      "application/vnd.application-factory.component.source-package.v1",
                      manifest + ":application/vnd.application-factory.canonical-manifest.v1+json",
                      root + ":application/vnd.application-factory.source-package.v1+tar",
                  ],
                  check=True,
              )
          PY
