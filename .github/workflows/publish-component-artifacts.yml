# Deterministic component artifact publication (Issue #127; S1).
#
# Sole production path: build_all -> deterministic OCI Image Layout ->
# publish_artifacts_to_oci (OCI Distribution HTTP, digest-addressed PUTs only).
# Mutable tags are never written or read as publication authority; every
# manifest is re-fetched and byte-verified after push, and the resulting
# PublicationRecords are persisted to publication-records.json inside the
# uploaded evidence archive. Reconciliation is NOT part of this workflow.

name: Publish component artifacts

on:
  pull_request:
    branches: [main]
    paths:
      - "src/factory_artifact/**"
      - "src/component_registry/**"
      - "scripts/build_component_artifacts.py"
      - "tests/test_component_artifact_publication.py"
      - "components/**"
      - "src/*_service/**"
      - "src/tenant_authority/**"
      - "src/saga/**"
      - "src/idempotency/**"
      - "factory/registry/**"
      - ".github/workflows/publish-component-artifacts.yml"
  push:
    branches: [main]
    paths:
      - "src/factory_artifact/**"
      - "src/component_registry/**"
      - "scripts/build_component_artifacts.py"
      - "components/**"
      - "src/*_service/**"
      - "src/tenant_authority/**"
      - "src/saga/**"
      - "src/idempotency/**"
      - "factory/registry/**"
      - ".github/workflows/publish-component-artifacts.yml"

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Build and verify all nine artifacts
        run: |
          python scripts/build_component_artifacts.py --output factory/artifacts
          python -m pytest -q tests/test_component_artifact_publication.py

      - name: Publish deterministic OCI artifacts to GHCR by digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/build_component_artifacts.py \
            --output factory/artifacts \
            --publish-ghcr \
            --write-records factory/artifacts/publication-records.json

      - name: Archive generated artifacts as publication evidence
        run: |
          tar --sort=name --format=gnu --mtime=@0 --owner=0 --group=0 --numeric-owner \
            --mode='a+rX,u+w,go-w' \
            -cf "$RUNNER_TEMP/component-artifacts.tar" factory/artifacts
          sha256sum "$RUNNER_TEMP/component-artifacts.tar"

      - name: Upload publication evidence
        uses: actions/upload-artifact@v4
        with:
          name: component-artifacts-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/component-artifacts.tar
          if-no-files-found: error
          retention-days: 90
