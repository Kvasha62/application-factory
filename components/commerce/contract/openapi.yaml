            заказ создан цепочкой контроля; возвращается представление заказа
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: >-
            команда без ключа идемпотентности (код IDEMPOTENCY_KEY_REQUIRED);
            отказ записан в аудит
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: >-
            субъект не установлен (код AUTHENTICATION_REQUIRED; причина в
            `error.details.reason`); отказ записан в аудит
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            решение власти — DENY либо корзина принадлежит другому покупателю
            (код AUTHORIZATION_DENIED; причина в `error.details.reason`);
            отказ записан в аудит
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            корзина неизвестна (cart_unknown), предложение исчезло или
            принадлежит другому тенанту (offer_unknown) либо у предложения
            нет текущей цены (код NOT_FOUND, price_unknown); отказ записан в
            аудит
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            корзина пуста (код INVALID_STATE_TRANSITION, причина
            `cart_empty`) либо ключ уже использован с другим binding (код
            IDEMPOTENCY_CONFLICT, причина `idempotency_conflict`); второй
            эффект не создан; отказ записан в аудит
          content:
            application/json:
              schema:
