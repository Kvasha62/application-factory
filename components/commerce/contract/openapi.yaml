openapi: 3.1.0
info:
  title: >-
    SCS-002 Commerce — Commerce business logic (Stage 3)
  version: 0.2.0
  description: >-
    Граница владельца коммерческих данных одной Platform Instance. Компонент
    владеет tenant-scoped коммерческими данными и доказывает, что ALLOW от
    IS-003 не является прямым доступом к данным: финальный контроль остаётся
    на границе владельца. Каждый доступ проходит фиксированную цепочку
    `ownership_boundary → authorization_decision → owned_data_operation`;
    решение по умолчанию — DENY, отказ зависимости закрывает доступ.
    Этап 3 (Issue #55, ADR-0013) публикует двенадцать операций: создание и
    чтение товара (`commerce.products.create` / `commerce.products.read`),
    определение предложения (`commerce.offers.create`), установку цены
    (`commerce.prices.create`), открытие/чтение/изменение корзины
    (`commerce.carts.create` / `commerce.carts.read` /
    `commerce.carts.update`), checkout (`commerce.checkout.create`), чтение
    заказа (`commerce.orders.read`) и фиксацию оплаты
    (`commerce.orders.pay`). Товар принадлежит эффективному тенанту verified
    identity и создаётся в состоянии `ACTIVE`; предложение определяется под
    существующим товаром того же тенанта; цена дописывается в append-only
    историю предложения; корзина принадлежит субъекту и меняется только его
    командами; checkout проверяет выбранные предложения и их текущие цены,
    создаёт заказ с неизменяемыми фактами покупки, расходует строки корзины
    и ставит `PENDING_PAYMENT`; оплата движется только `PENDING_PAYMENT →
    PAID`. Субъект достигает только своих корзин и заказов — чужие
    отказываются причиной `buyer_mismatch` даже внутри того же тенанта.
    Каждая команда изменения состояния защищена IS-005 (`Idempotency-Key`
    обязателен): точный replay возвращает записанный результат без второго
    эффекта, изменённый binding отказывается. Checkout — бизнес-команда, а
    не сущность: персистентного Checkout не существует. Payment —
    изменяемое коммерческое состояние/результат, связанное с Order и
    принадлежащее Commerce: Payment Service, провайдер и gateway-имитация
    отсутствуют. Отказы используют утверждённый конверт SCS-002:
    `error.code` / `error.message` / `error.details` плюс `request_id` /
    `correlation_id` верхнего уровня; стабильная внутренняя причина
    сохраняется в `error.details.reason`.
servers:
  - url: /api/v1/commerce
    description: Commerce API base path of one Platform Instance
paths:
  /products:
    post:
      summary: Create one owned Product (commerce.products.create)
      description: >-
        `Authorization` несёт credential субъекта; он проверяется в IS-001
        внутри решения IS-003 — сам компонент credentials не проверяет.
        `X-Tenant-Id` — только cross-check, передаётся как есть и никогда не
        выбирает эффективный тенант (LAW-16a): тенант товара выводится из
        verified identity через опубликованную цепочку. `Idempotency-Key`
        обязателен: команда доставляется через IS-005, точный replay
        возвращает записанный товар без второго эффекта, а повтор ключа с
        другим binding отказывается. Новый товар создаётся в состоянии
        `ACTIVE`. Тело команды называет только товар; тенант и идентичность
        в нём отсутствуют по построению.
      operationId: createProduct
      security:
        - subjectAuth: []
      parameters:
        - in: header
          name: X-Tenant-Id
          required: false
          schema:
            type: string
          description: caller-supplied cross-check only; never a source of tenant identity
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
          description: >-
            обязателен для команды; отсутствие отказывается кодом
            IDEMPOTENCY_KEY_REQUIRED
        - in: header
          name: X-Request-Id
          required: false
          schema:
            type: string
        - in: header
          name: X-Correlation-Id
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCreate"
      responses:
        "201":
          description: >-
            товар создан цепочкой контроля; возвращается представление товара
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: >-
            команда без ключа идемпотентности (код IDEMPOTENCY_KEY_REQUIRED);
            отказ записан в аудит
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: >-
            субъект не установлен (код AUTHENTICATION_REQUIRED; причина в
            `error.details.reason`); отказ записан в аудит
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            решение власти — DENY (код AUTHORIZATION_DENIED; причина в
            `error.details.reason`); отказ записан в аудит
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            ключ уже использован с другим binding (код IDEMPOTENCY_CONFLICT,
            причина `idempotency_conflict`); второй эффект не создан; отказ
            записан в аудит
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >-
            payload не проходит правила команды (код VALIDATION_ERROR,
            причина `validation_error`) либо запрос не читается опубликованной
            схемой (код INVALID_REQUEST, причина `malformed_request`); отказ
            записан в аудит
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: >-
            зависимость принятия решения не ответила либо ответила вне
            опубликованного контракта (код DEPENDENCY_UNAVAILABLE): доступ
            закрыт; отказ записан в аудит
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /products/{product_id}:
    get:
      summary: Read one owned Product (commerce.products.read)
      description: >-
        `Authorization` несёт credential субъекта; он проверяется в IS-001
        внутри решения IS-003 — сам компонент credentials не проверяет.
        `X-Tenant-Id` — только cross-check, передаётся как есть и никогда не
        выбирает эффективный тенант (LAW-16a). Товар возвращается только
        после полной цепочки контроля; любой иной исход — отказ в утверждённом
        конверте со стабильным кодом, записанный в аудит с request_id и
        correlation_id.
      operationId: readProduct
      security:
        - subjectAuth: []
      parameters:
        - in: path
          name: product_id
          required: true
          schema:
            type: string
        - in: header
          name: X-Tenant-Id
          required: false
          schema:
            type: string
          description: caller-supplied cross-check only; never a source of tenant identity
        - in: header
          name: X-Request-Id
          required: false
          schema:
            type: string
        - in: header
          name: X-Correlation-Id
          required: false
          schema:
            type: string
      responses:
        "200":
          description: >-
            доступ разрешён цепочкой контроля; возвращается представление товара
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          description: >-
            субъект не установлен (код AUTHENTICATION_REQUIRED; причина в
            `error.details.reason`); отказ записан в аудит
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            решение власти — DENY (код AUTHORIZATION_DENIED; причина в
            `error.details.reason`) либо запись принадлежит другому компоненту
            (owner_mismatch); отказ записан в аудит
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            товар неизвестен этому владельцу (код NOT_FOUND,
            product_unknown); решение у власти не запрашивается; отказ
            записан в аудит
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: >-
            зависимость принятия решения не ответила либо ответила вне
            опубликованного контракта (код DEPENDENCY_UNAVAILABLE): доступ
            закрыт; отказ записан в аудит
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /offers:
    post:
      summary: Define one Offer of a Product (commerce.offers.create)
      description: >-
        Родительский товар должен существовать здесь и принадлежать
        эффективному тенанту verified identity; отсутствующий и чужой
        родитель — одинаково `product_unknown`. Новое предложение создаётся в
        состоянии `ACTIVE` и принадлежит тенанту товара по построению.
        `X-Tenant-Id` — только cross-check (LAW-16a). `Idempotency-Key`
        обязателен: команда доставляется через IS-005, точный replay
        возвращает записанное предложение без второго эффекта, повтор ключа с
        другим binding отказывается.
      operationId: createOffer
      security:
        - subjectAuth: []
      parameters:
        - in: header
          name: X-Tenant-Id
          required: false
          schema:
            type: string
          description: caller-supplied cross-check only; never a source of tenant identity
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
          description: >-
            обязателен для команды; отсутствие отказывается кодом
            IDEMPOTENCY_KEY_REQUIRED
        - in: header
          name: X-Request-Id
          required: false
          schema:
            type: string
        - in: header
          name: X-Correlation-Id
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfferCreate"
      responses:
        "201":
          description: >-
            предложение определено цепочкой контроля; возвращается представление
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Offer"
        "400":
          description: >-
            команда без ключа идемпотентности (код IDEMPOTENCY_KEY_REQUIRED);
            отказ записан в аудит
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: >-
            субъект не установлен (код AUTHENTICATION_REQUIRED; причина в
            `error.details.reason`); отказ записан в аудит
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            решение власти — DENY (код AUTHORIZATION_DENIED; причина в
            `error.details.reason`); отказ записан в аудит
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            родительский товар неизвестен или принадлежит другому тенанту (код
            NOT_FOUND, product_unknown); отказ записан в аудит
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            ключ уже использован с другим binding (код IDEMPOTENCY_CONFLICT,
            причина `idempotency_conflict`); второй эффект не создан; отказ
            записан в аудит
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >-
            payload не проходит правила команды (код VALIDATION_ERROR,
            причина `validation_error`) либо запрос не читается опубликованной
            схемой (код INVALID_REQUEST, причина `malformed_request`); отказ
            записан в аудит
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: >-
            зависимость принятия решения не ответила либо ответила вне
            опубликованного контракта (код DEPENDENCY_UNAVAILABLE): доступ
            закрыт; отказ записан в аудит
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /prices:
    post:
      summary: Set the current price of an Offer (commerce.prices.create)
      description: >-
        Родительское предложение должно существовать здесь и принадлежать
        эффективному тенанту verified identity; отсутствующий и чужой
        родитель — одинаково `offer_unknown`. Новая запись дописывается в
        историю цен предложения: прошлые записи не затрагиваются, операции
        изменения цены не существует. `X-Tenant-Id` — только cross-check
        (LAW-16a). `Idempotency-Key` обязателен (IS-005).
      operationId: createPrice
      security:
        - subjectAuth: []
      parameters:
        - in: header
          name: X-Tenant-Id
          required: false
          schema:
            type: string
          description: caller-supplied cross-check only; never a source of tenant identity
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
          description: >-
            обязателен для команды; отсутствие отказывается кодом
            IDEMPOTENCY_KEY_REQUIRED
        - in: header
          name: X-Request-Id
          required: false
          schema:
            type: string
        - in: header
          name: X-Correlation-Id
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceCreate"
      responses:
        "201":
          description: >-
            цена дописана цепочкой контроля; возвращается представление цены
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Price"
        "400":
          description: >-
            команда без ключа идемпотентности (код IDEMPOTENCY_KEY_REQUIRED);
            отказ записан в аудит
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: >-
            субъект не установлен (код AUTHENTICATION_REQUIRED; причина в
            `error.details.reason`); отказ записан в аудит
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            решение власти — DENY (код AUTHORIZATION_DENIED; причина в
            `error.details.reason`); отказ записан в аудит
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            родительское предложение неизвестно или принадлежит другому
            тенанту (код NOT_FOUND, offer_unknown); отказ записан в аудит
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            ключ уже использован с другим binding (код IDEMPOTENCY_CONFLICT,
            причина `idempotency_conflict`); второй эффект не создан; отказ
            записан в аудит
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >-
            payload не проходит правила команды (код VALIDATION_ERROR,
            причина `validation_error`) либо запрос не читается опубликованной
            схемой (код INVALID_REQUEST, причина `malformed_request`); отказ
            записан в аудит
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: >-
            зависимость принятия решения не ответила либо ответила вне
            опубликованного контракта (код DEPENDENCY_UNAVAILABLE): доступ
            закрыт; отказ записан в аудит
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /carts:
    post:
      summary: Open one Cart for the subject (commerce.carts.create)
      description: >-
        Команда не несёт тела: покупатель — verified subject, тенант —
        эффективный тенант цепочки, поэтому субъект может открыть только свою
        корзину. Новая корзина не содержит строк. `X-Tenant-Id` — только
        cross-check (LAW-16a). `Idempotency-Key` обязателен (IS-005).
      operationId: createCart
      security:
        - subjectAuth: []
      parameters:
        - in: header
          name: X-Tenant-Id
          required: false
          schema:
            type: string
          description: caller-supplied cross-check only; never a source of tenant identity
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
          description: >-
            обязателен для команды; отсутствие отказывается кодом
            IDEMPOTENCY_KEY_REQUIRED
        - in: header
          name: X-Request-Id
          required: false
          schema:
            type: string
        - in: header
          name: X-Correlation-Id
          required: false
          schema:
            type: string
      responses:
        "201":
          description: >-
            корзина открыта цепочкой контроля; возвращается представление
            корзины без строк
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "400":
          description: >-
            команда без ключа идемпотентности (код IDEMPOTENCY_KEY_REQUIRED);
            отказ записан в аудит
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: >-
            субъект не установлен (код AUTHENTICATION_REQUIRED; причина в
            `error.details.reason`); отказ записан в аудит
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            решение власти — DENY (код AUTHORIZATION_DENIED; причина в
            `error.details.reason`); отказ записан в аудит
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >-
            ключ уже использован с другим binding (код IDEMPOTENCY_CONFLICT,
            причина `idempotency_conflict`); второй эффект не создан; отказ
            записан в аудит
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: >-
            запрос не читается опубликованной схемой (код INVALID_REQUEST,
            причина `malformed_request`); отказ записан в аудит
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: >-
            зависимость принятия решения не ответила либо ответила вне
            опубликованного контракта (код DEPENDENCY_UNAVAILABLE): доступ
            закрыт; отказ записан в аудит
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /carts/{cart_id}:
    get:
      summary: Read one owned Cart (commerce.carts.read)
      description: >-
        Корзина возвращается только после полной цепочки контроля. Субъект
        читает только свои корзины: корзина другого покупателя отказывается
        причиной `buyer_mismatch` даже внутри того же тенанта. `X-Tenant-Id` —
        только cross-check (LAW-16a).
      operationId: readCart
      security:
        - subjectAuth: []
      parameters:
        - in: path
          name: cart_id
          required: true
          schema:
            type: string
        - in: header
          name: X-Tenant-Id
          required: false
          schema:
            type: string
          description: caller-supplied cross-check only; never a source of tenant identity
        - in: header
          name: X-Request-Id
          required: false
          schema:
            type: string
        - in: header
          name: X-Correlation-Id
          required: false
          schema:
            type: string
      responses:
        "200":
          description: >-
            доступ разрешён цепочкой контроля; возвращается представление
            корзины со строками
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Cart"
        "401":
          description: >-
            субъект не установлен (код AUTHENTICATION_REQUIRED; причина в
            `error.details.reason`); отказ записан в аудит
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: >-
            решение власти — DENY либо корзина принадлежит другому покупателю
            (код AUTHORIZATION_DENIED; причина в `error.details.reason`);
            отказ записан в аудит
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: >-
            корзина неизвестна этому владельцу (код NOT_FOUND, cart_unknown);
            решение у власти не запрашивается; отказ записан в аудит
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: >-
            зависимость принятия решения не ответила либо ответила вне
            опубликованного контракта (код DEPENDENCY_UNAVAILABLE): доступ
            закрыт; отказ записан в аудит
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /carts/{cart_id}/items:
    post:
      summary: Add one offer to a Cart (commerce.carts.update)
      description: >-
