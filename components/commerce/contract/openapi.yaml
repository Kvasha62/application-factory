          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: >-
            зависимость принятия решения не ответила либо ответила вне
            опубликованного контракта (код DEPENDENCY_UNAVAILABLE): доступ
            закрыт; отказ записан в аудит
          content:
            application/json:
              schema:
