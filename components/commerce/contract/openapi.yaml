      scheme: bearer
      description: >-
        credential субъекта; проверяется в IS-001 внутри решения IS-003, а не
        этим компонентом
  schemas:
    Product:
      type: object
      additionalProperties: false
      required: [product_id, name, description, status, created_by, created_at, updated_at]
      properties:
        product_id:
          type: string
          description: непрозрачный идентификатор товара
        name:
          type: string
          description: название товара (непустое, не длиннее 512 символов)
        description:
          type: string
          description: описание товара (не длиннее 4096 символов)
        status:
          type: string
          enum: [ACTIVE]
          description: >-
            жизненный цикл товара этого среза — ровно одно состояние;
            переходы каталога появятся в следующих срезах
        created_by:
          type: string
          description: непрозрачная ссылка на verified identity, создавшую товар
        created_at:
          type: string
        updated_at:
          type: string
    ProductCreate:
      type: object
      additionalProperties: false
      required: [name, description]
      properties:
        name:
          type: string
          description: непустое название не длиннее 512 символов
        description:
          type: string
          description: описание не длиннее 4096 символов
    Offer:
      type: object
      additionalProperties: false
      required: [offer_id, product_id, name, status, created_by, created_at, updated_at]
      properties:
        offer_id:
          type: string
          description: непрозрачный идентификатор предложения
        product_id:
          type: string
          description: товар, предложением которого является Offer (тот же тенант)
        name:
          type: string
          description: название предложения (непустое, не длиннее 512 символов)
        status:
          type: string
          enum: [ACTIVE]
          description: жизненный цикл предложения этого среза — ровно одно состояние
        created_by:
          type: string
          description: непрозрачная ссылка на verified identity, определившую предложение
        created_at:
          type: string
        updated_at:
          type: string
    OfferCreate:
      type: object
      additionalProperties: false
      required: [product_id, name]
      properties:
        product_id:
          type: string
          description: существующий товар эффективного тенанта
        name:
          type: string
          description: непустое название не длиннее 512 символов
    Price:
      type: object
      additionalProperties: false
      required: [price_id, offer_id, amount, currency, created_at]
      properties:
        price_id:
          type: string
          description: непрозрачный идентификатор цены
        offer_id:
          type: string
          description: предложение, цену которого фиксирует запись (тот же тенант)
        amount:
          type: integer
          minimum: 0
          description: сумма в минорных единицах валюты; деньги — не float
        currency:
          type: string
          description: код валюты (непустой, не длиннее 3 символов)
        created_at:
          type: string
    PriceCreate:
      type: object
      additionalProperties: false
      required: [offer_id, amount, currency]
      properties:
        offer_id:
          type: string
          description: существующее предложение эффективного тенанта
        amount:
          type: integer
          minimum: 0
          description: неотрицательная сумма в минорных единицах валюты
        currency:
          type: string
          description: непустой код валюты не длиннее 3 символов
    Cart:
      type: object
      additionalProperties: false
      required: [cart_id, buyer_identity_id, created_at, updated_at, items]
      properties:
        cart_id:
          type: string
          description: непрозрачный идентификатор корзины
        buyer_identity_id:
          type: string
          description: непрозрачная ссылка на verified subject — владельца корзины
        created_at:
          type: string
        updated_at:
          type: string
        items:
          type: array
          description: выбранные предложения в детерминированном порядке; пустая корзина — пустой список
          items:
            $ref: "#/components/schemas/CartLine"
    CartLine:
      type: object
      additionalProperties: false
      required: [offer_id, product_id, quantity]
      properties:
        offer_id:
          type: string
          description: выбранное предложение
        product_id:
          type: string
          description: товар выбранного предложения
        quantity:
          type: integer
          minimum: 1
          description: положительное количество единиц
    CartItemAdd:
      type: object
      additionalProperties: false
      required: [offer_id, quantity]
      properties:
        offer_id:
          type: string
          description: предложение тенанта корзины
        quantity:
          type: integer
          minimum: 1
          description: положительное количество единиц
    CartItemQuantity:
      type: object
      additionalProperties: false
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 1
          description: абсолютное положительное количество единиц
    CheckoutCreate:
      type: object
      additionalProperties: false
      required: [cart_id]
      properties:
        cart_id:
          type: string
          description: собственная корзина субъекта, преобразуемая в заказ
    Order:
      type: object
      additionalProperties: false
      required: [order_id, buyer_identity_id, payment_state, created_at, updated_at, lines]
      properties:
        order_id:
          type: string
          description: непрозрачный идентификатор заказа
        buyer_identity_id:
          type: string
          description: непрозрачная ссылка на verified subject — покупателя
        payment_state:
          type: string
          enum: [PENDING_PAYMENT, PAID]
          description: изменяемое коммерческое состояние/результат оплаты заказа
        created_at:
          type: string
        updated_at:
          type: string
        lines:
          type: array
          description: купленные позиции в детерминированном порядке
          items:
            $ref: "#/components/schemas/OrderLine"
    OrderLine:
      type: object
      additionalProperties: false
      required: [order_line_id, offer_id, product_id, amount, currency, quantity]
      properties:
        order_line_id:
          type: string
          description: непрозрачный идентификатор позиции
        offer_id:
          type: string
          description: купленное предложение
        product_id:
          type: string
          description: товар купленного предложения
        amount:
          type: integer
          minimum: 0
          description: неизменяемый снепшот цены в минорных единицах
        currency:
          type: string
          description: неизменяемый снепшот кода валюты
        quantity:
          type: integer
          minimum: 1
          description: сколько единиц куплено по снепшот-цене
    Error:
      type: object
      additionalProperties: false
      required: [error, request_id, correlation_id]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, details]
          properties:
            code:
              type: string
              enum: [AUTHENTICATION_REQUIRED, AUTHORIZATION_DENIED, NOT_FOUND, INVALID_REQUEST, VALIDATION_ERROR, INVALID_STATE_TRANSITION, IDEMPOTENCY_KEY_REQUIRED, IDEMPOTENCY_CONFLICT, DEPENDENCY_UNAVAILABLE]
              description: минимальный опубликованный код отказа SCS-002
            message:
              type: string
              description: стабильное человекочитаемое сообщение кода
            details:
              type: object
              additionalProperties: true
              required: [reason]
              properties:
                reason:
                  type: string
                  description: стабильная внутренняя причина отказа
        request_id:
          type: string
          description: идентификатор запроса записи аудита
        correlation_id:
          type: string
          description: идентификатор корреляции записи аудита
