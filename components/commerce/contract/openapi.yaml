  /checkout:
    post:
      summary: Convert one owned Cart into an Order (commerce.checkout.create)
      description: >-
        Checkout — бизнес-команда, а не сущность: персистентного Checkout не
        существует. Корзина должна существовать здесь и принадлежать
        субъекту; команда проверяет выбранные предложения и их текущие цены,
        создаёт заказ с неизменяемыми фактами покупки и снепшотами цен,
        расходует строки корзины и ставит начальное состояние
        `PENDING_PAYMENT`. Пустая корзина отказывается причиной `cart_empty`;
        предложение без текущей цены — причиной `price_unknown`.
        Параллельные checkout одной корзины сериализуются в доменной
        критической секции корзины: второй отказывается. `X-Tenant-Id` —
        только cross-check (LAW-16a). `Idempotency-Key` обязателен (IS-005):
        точный replay возвращает записанный заказ без второго заказа.
      operationId: checkout
      security:
        - subjectAuth: []
      parameters:
        - in: header
          name: X-Tenant-Id
          required: false
          schema:
            type: string
          description: caller-supplied cross-check only; never a source of tenant identity
        - in: header
          name: Idempotency-Key
          required: false
