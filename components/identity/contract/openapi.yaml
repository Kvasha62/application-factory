openapi: 3.1.0
info:
  title: IS-001 Identity / Tenant Context
  version: 0.1.0
paths:
  /health:
    get:
      responses:
        "200":
          description: liveness
  /ready:
    get:
      responses:
        "200":
          description: readiness
  /api/v1/me:
    get:
      security:
        - bearerAuth: []
      responses:
        "200":
          description: verified identity
        "401":
          description: identity denied
  /api/v1/records/{record_id}:
    get:
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: record_id
          required: true
          schema:
            type: string
        - in: header
          name: X-Tenant-Id
          required: false
          schema:
            type: string
          description: caller-supplied tenant_id used only as cross-check
      responses:
        "200":
          description: tenant-scoped record
        "401":
          description: authentication denied
        "403":
          description: authorization or tenant isolation denied
    put:
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: record_id
          required: true
          schema:
            type: string
        - in: header
          name: Idempotency-Key
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [record_id, body]
              properties:
                record_id:
                  type: string
                body:
                  type: string
                tenant_id:
                  type: string
                  description: caller-supplied cross-check only
      responses:
        "200":
          description: written or idempotent replay
        "401":
          description: authentication denied
        "403":
          description: authorization denied
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
