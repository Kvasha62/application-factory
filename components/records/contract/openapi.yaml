openapi: 3.1.0
info:
  title: IS-004 Data Ownership / Resource Boundary
  version: 0.1.0
  description: >-
    Граница владельца данных одной Platform Instance. Компонент владеет
    tenant-scoped ресурсами и доказывает, что ALLOW от IS-003 не является
    прямым доступом к данным: финальный контроль остаётся на границе
    владельца. Каждый доступ проходит фиксированную цепочку
    `ownership_boundary → authorization_decision → owned_data_operation`;
    решение по умолчанию — DENY, отказ зависимости закрывает доступ.
paths:
  /health:
    get:
      responses:
        "200":
          description: liveness
  /ready:
    get:
      responses:
        "200":
          description: readiness
  /api/v1/resources/{resource_id}:
    get:
      summary: Serve one owned resource (records.read)
      description: >-
        `Authorization` несёт credential субъекта; он проверяется в IS-001
        внутри решения IS-003 — сам компонент credentials не проверяет.
        `X-Tenant-Id` — только cross-check, передаётся как есть и никогда не
        выбирает эффективный тенант (LAW-16a). Ресурс возвращается только
        после полной цепочки контроля; любой иной исход — отказ со стабильным
        кодом причины, записанный в аудит с request_id и correlation_id.
      security:
        - subjectAuth: []
      parameters:
        - in: path
          name: resource_id
          required: true
          schema:
            type: string
        - in: header
          name: X-Tenant-Id
          required: false
          schema:
            type: string
          description: caller-supplied cross-check only; never a source of tenant identity
        - in: header
          name: X-Request-Id
          required: false
          schema:
            type: string
        - in: header
          name: X-Correlation-Id
          required: false
          schema:
            type: string
      responses:
        "200":
          description: >-
            доступ разрешён цепочкой контроля; возвращаются ровно пять полей
            ресурса
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "401":
          description: >-
            субъект не установлен (missing_identity, invalid_identity,
            unknown_identity); отказ записан в аудит
        "403":
          description: >-
            решение власти — DENY (например, resource_tenant_mismatch,
            tenant_suspended, permission_not_granted) либо ресурс принадлежит
            другому компоненту (owner_mismatch); отказ записан в аудит
        "404":
          description: >-
            ресурс неизвестен этому владельцу (resource_unknown); решение у
            власти не запрашивается; отказ записан в аудит
        "503":
          description: >-
            зависимость принятия решения не ответила либо ответила вне
            опубликованного контракта: доступ закрыт (authorization_unavailable);
            отказ записан в аудит
  /api/v1/resources/{resource_id}/transitions:
    post:
      summary: Transition the state of one owned resource (records.write)
      description: >-
        Та же цепочка контроля, что и у чтения. Машина состояний закрыта:
        повторный или неприменимый переход отклоняется владельцем с
        `invalid_transition` после решения авторизации, поэтому повтор запроса
        не даёт второго эффекта и `Idempotency-Key` в этом срезе не требуется.
      security:
        - subjectAuth: []
      parameters:
        - in: path
          name: resource_id
          required: true
          schema:
            type: string
        - in: header
          name: X-Tenant-Id
          required: false
          schema:
            type: string
          description: caller-supplied cross-check only; never a source of tenant identity
        - in: header
          name: X-Request-Id
          required: false
          schema:
            type: string
        - in: header
          name: X-Correlation-Id
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionRequest"
      responses:
        "200":
          description: переход применён владельцем; возвращаются пять полей ресурса
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "401":
          description: субъект не установлен; отказ записан в аудит
        "403":
          description: решение власти — DENY либо чужой владелец; отказ записан в аудит
        "404":
          description: ресурс неизвестен этому владельцу; отказ записан в аудит
        "409":
          description: >-
            переход неприменим к текущему состоянию ресурса
            (invalid_transition); операция с данными не выполнялась
        "422":
          description: >-
            запрос нечитаем опубликованной схемой (отсутствует обязательное
            поле, незадекларированное поле, неверный тип); отказ записан в
            аудит с request_id и correlation_id, значения полезной нагрузки в
            журнал не попадают
        "503":
          description: >-
            зависимость принятия решения не ответила либо ответила вне
            контракта: доступ закрыт (authorization_unavailable); отказ записан
            в аудит
components:
  securitySchemes:
    subjectAuth:
      type: http
      scheme: bearer
      description: >-
        credential субъекта; проверяется в IS-001 внутри решения IS-003, а не
        этим компонентом
  schemas:
    Resource:
      type: object
      additionalProperties: false
      required: [resource_id, resource_type, owner_component, tenant_id, state]
      properties:
        resource_id:
          type: string
        resource_type:
          type: string
        owner_component:
          type: string
          description: ровно один владелец; единственный источник истины о владельце
        tenant_id:
          type: string
          description: Tenant, которому принадлежит ресурс, — факт хранилища владельца
        state:
          type: string
          enum: [draft, active, archived]
    TransitionRequest:
      type: object
      additionalProperties: false
      required: [transition]
      properties:
        transition:
          type: string
          enum: [activate, archive]
