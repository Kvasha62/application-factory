openapi: 3.1.0
info:
  title: Idempotency Guard Contract
  version: 0.1.0
  description: Foundation contract for idempotency (IS-005)
components:
  headers:
    IdempotencyKey:
      description: |
        A client-generated unique identifier for the request.
        A replay of the same request with the same key returns the original result.
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 128
  schemas:
    IdempotencyConflict:
      type: object
      description: |
        Returned when the same Idempotency-Key is used for a different request
        (different identity, tenant, operation, or payload fingerprint).
      required:
        - error
        - details
      properties:
        error:
          type: string
          enum: [idempotency_conflict]
        details:
          type: object
          properties:
            key:
              type: string
